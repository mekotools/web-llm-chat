name: Abbild bauen

# Baut das fertige Abbild und legt es in der Registry ab. Der Lauf holt zur
# Bauzeit die Modellgewichte (276 MB) und den WebLLM-Rechenkern (4,8 MB) und
# prueft beide gegen die mitgelieferten SHA-256-Pruefsummen. Weil der Lauf
# INNERHALB dieses oeffentlichen Repos schibt, entsteht das Paket in GHCR
# oeffentlich und ist anonym ziehbar.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mekotools/web-llm-chat:latest
            ghcr.io/mekotools/web-llm-chat:${{ github.sha }}

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/web-llm-chat:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/web-llm-chat:latest || true

      - name: Sichtbarkeit des Pakets nachsehen
        # Die Sichtbarkeit eines Pakets laesst sich NICHT ueber die Schnittstelle
        # aendern — fuer Pakete einer Organisation gibt es keinen solchen Endpunkt.
        # Ein Paket, das aus einem privaten Repo entstand, bleibt privat; die
        # Loesung ist dann: Paket loeschen und den Bau im oeffentlichen Repo neu
        # ausloesen (siehe Skill mekotools-katalog, references/abbilder-und-digests.md).
        # Dieser Schritt scheitert bewusst NICHT, sondern meldet den Ist-Zustand.
        env:
          KENNUNG: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          S=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $KENNUNG" \
            "https://api.github.com/orgs/mekotools/packages/container/web-llm-chat" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('visibility'))" 2>/dev/null || echo "unbekannt")
          echo "Sichtbarkeit des Pakets: $S"
          if [ "$S" != "public" ]; then
            echo "::warning::Paket ist nicht oeffentlich. Einmalig umstellen: https://github.com/orgs/mekotools/packages/container/web-llm-chat/settings"
          fi
          TOK=$(curl -s "https://ghcr.io/token?scope=repository:mekotools/web-llm-chat:pull&service=ghcr.io" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          A=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            https://ghcr.io/v2/mekotools/web-llm-chat/manifests/latest)
          echo "Anonymer Abruf des Pakets: $A (200 = jeder kann es ziehen)"
